<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
<h1>Exemplo de Formulário</h1>
<form action="cadastro.php" method="get" autocomplete="on">

    <p>
        <label for="iano">Em que ano você nasceu? </label>
<!--        <input type="number" name="ano" id="iano" min="1900" max="2026"  onclick="iidade.innerHTML = new Date().getFullYear() - Number(iano.value)">-->
<!--        Ou faça por uma chamada de função-->
        <input type="number" name="ano" id="iano" min="1900" max="2026"  onclick="calcIdade()">
    </p>

    <p>
        <label for="iidade">Sua idade é: </label>
        <output id="iidade" name="idade"></output>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</form>

<script>
    function calcIdade() {
      let atual = new Date().getFullYear()
      iidade.innerHTML = Number(atual) - Number(iano.value)
    }
</script>

</body>
</html>
