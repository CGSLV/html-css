<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Testes Flexbox</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        main {
            display: flex;
            flex-flow: row wrap-reverse;
        }

        div#img{
            margin: auto;
        }


    </style>
</head>
<body>

    <main>
        <div id="txt">
            <h2>Elemento Media->Text</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ab blanditiis commodi corporis dolore, dolorem doloremque eaque error eum facere id ipsam labore laboriosam laudantium maxime nisi perspiciatis ratione tempore, totam.</p>
        </div>

        <div id="img" style="width: 500px">
            <img src="imagens/flexbox-image.png" alt="Vetor Criando Website">
        </div>


    </main>

</body>
</html>
