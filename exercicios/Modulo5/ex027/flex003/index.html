<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: salmon;
            border: 1px solid black;

            flex-flow: row wrap;
            /*flex-direction: row;*/
            /*flex-wrap: wrap-reverse;*/

            display: flex;
        }

        div.filho {
            background-color: cornflowerblue;
            border: 1px solid black;
            text-align: center;

            flex: auto;



        }
    </style>
</head>
<body>
<!--    Exemplo simples utilizando Divs-->
    <div class="container">
        <div class="filho">Exemplo de Bloco A</div>
        <div class="filho">Exemplo de Bloco B</div>
        <div class="filho">Exemplo de Bloco C</div>
        <div class="filho">Exemplo de Bloco D</div>
        <div class="filho">Exemplo de Bloco E</div>
        <div class="filho">Exemplo de Bloco F</div>
        <div class="filho">Exemplo de Bloco G</div>
    </div>

</body>
</html>
