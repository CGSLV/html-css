<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: salmon;
            border: 1px solid black;
            flex-flow: row wrap;
            height: 400px;
            align-content: space-around;

            display: flex;
        }

        div.filho {
            background-color: cornflowerblue;
            border: 1px solid black;
            text-align: center;
            padding: 40px;


        }
    </style>
</head>
<body>
<!--    Exemplo simples utilizando Divs-->
    <div class="container">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
        <div class="filho">H</div>
        <div class="filho">I</div>
        <div class="filho">J</div>
        <div class="filho">K</div>
        <div class="filho">L</div>
        <div class="filho">M</div>
    </div>

</body>
</html>
