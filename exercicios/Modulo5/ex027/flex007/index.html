<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: salmon;
            border: 1px solid black;


            display: flex;
            flex-flow: row wrap;
        }

        div.filho {
            background-color: cornflowerblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px

        }

        div#i1 {
            order: 0
        }

        div#i2 {
            order: -2
        }

        div#i3 {
            order: 4
        }

        div#i4 {
            order: 8
        }

        div#i5 {
            order: 2
        }

        div#i6 {
            order: 0
        }

        div#i7 {
            order: -4
        }

    </style>
</head>
<body>
<!--    Exemplo simples utilizando Divs-->
    <div class="container">
        <div class="filho" id="i1">A</div>
        <div class="filho" id="i2">B</div>
        <div class="filho" id="i3">C</div>
        <div class="filho" id="i4">D</div>
        <div class="filho" id="i5">E</div>
        <div class="filho" id="i6">F</div>
        <div class="filho" id="i7">G</div>
    </div>

</body>
</html>
