<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: salmon;
            border: 1px solid black;

            display: flex;
            flex-flow: row wrap;
        }

        div.filho {
            background-color: cornflowerblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px


        }
    </style>
</head>
<body>
<!--    Exemplo simples utilizando Divs-->
    <div class="container">
        <div class="filho">A</div>
        <div class="filho">BBBBBBBBBBBB</div>
        <div class="filho">C</div>
        <div class="filho">DDDDDDDDDDDDDDDDDDDD</div>
        <div class="filho">E</div>
        <div class="filho">FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF</div>
        <div class="filho">G</div>
    </div>

</body>
</html>
