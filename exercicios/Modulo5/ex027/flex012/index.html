<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: salmon;



            display: flex;
            flex-flow: row nowrap;
        }

        div.filho {
            background-color: cornflowerblue;
            border: 1px solid black;
            text-align: center;


        }

        div#cxA {
            /*flex-grow: 0;*/
            /*flex-shrink: 1;*/
            /*flex-basis: 150px;*/

            flex: 0 1 150px;
        }

        div#cxB {
            /*flex-grow: 2;*/
            /*flex-shrink: 0;*/
            /*flex-basis: 150px;*/

            flex: 2 0 150px;
        }

        div#cxC {
            /*flex-grow: 1;*/
            /*flex-shrink: 2;*/
            /*flex-basis: 150px;*/

            flex: 1 2 auto;
        }
    </style>
</head>
<body>
<!--    Exemplo simples utilizando Divs-->
    <div class="container">
        <div class="filho" id="cxA">A</div>
        <div class="filho" id="cxB">B</div>
        <div class="filho" id="cxC">C</div>
    </div>

</body>
</html>
